# Metabase for Cuanto Ads (deb). Reads the warehouse (db `warehouse`, schema meta_ads) as role warehouse_ro.
# Edge: Cloudflare tunnel `deb` -> bi.cuantolabs.com -> http://127.0.0.1:4420, behind a Cloudflare Access app (Eliran only).
# Secrets: .env next to this file (mode 600): MB_DB_PASS. Run: docker compose -p metabase-ads up -d
services:
  metabase-db:
    image: postgres:16
    container_name: metabase-ads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASS:?set in .env}
    volumes:
      - metabase_pg16:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.65.7.1
    container_name: metabase-ads
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4420:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASS:?set in .env}
      MB_DB_HOST: metabase-db
      MB_SITE_URL: https://bi.cuantolabs.com
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_OPTS: -Xmx1536m
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  metabase_pg16:
